name: Python tests

on:
  push:
    branches:
      - main
      - feat/data-source-collection-validation
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        if: matrix.python-version != '3.13'
        run: python -m pip install -e ".[dev]"
      - name: Install package, test dependencies and optional collectors
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[dev,tiktok-embedded,trendspyg]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: >-
          python -m ruff check
          src/fashion_radar/source_store.py
          src/fashion_radar/providers/tiktok/dtk_embedded.py
          src/fashion_radar/collectors/tiktok_embedded.py
          src/fashion_radar/collectors/trendspyg_trends.py
          src/fashion_radar/collectors/dataforseo_trends.py
          tests/test_trendspyg_collector.py
          tests/test_trendspyg_run_audit.py
          tests/test_source_coverage_audit.py
          tests/test_tiktok_embedded_run_audit.py
          tests/test_tiktok_embedded_provider.py
          scripts/collect_tiktok_embedded.py
          scripts/collect_trendspyg_trends.py
          scripts/audit_tiktok_embedded_run.py
          scripts/audit_trendspyg_run.py
          scripts/audit_source_coverage.py
          scripts/migrate_source_run_observation_links.py
      - name: Compile project modules
        run: python -m compileall -q src app scripts tests
