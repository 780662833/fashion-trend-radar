<!-- 上一篇/下一篇 -->
<script id="articleNeighbor-template" type="text/html">
  <% if(obj.preDocId){ %>
    <div class="recent-item">
        <span class="tag pre-page"><%- window.util.isEnglish() ? 'PREV' : '上一篇' %></span>
        <span class="time"><%- obj.preDocReltime?publishTimeFormat(obj.preDocReltime):'' %></span>
        <div class="title">
            <a class="ellipsis" href="<%= obj.preDocPuburl %>" title="<%= obj.preDocTitle %>"><%= obj.preDocTitle %></a>
        </div>
    </div>
  <%}%>
  <% if(obj.nextDocId){ %>
    <div class="recent-item">
        <span class="tag next-page"><%- window.util.isEnglish() ? 'NEXT' : '下一篇' %></span>
        <span class="time"><%- obj.nextDocReltime?publishTimeFormat(obj.nextDocReltime):'' %></span>
        <div class="title">
            <a class="ellipsis" href="<%= obj.nextDocPuburl %>" title="<%= obj.nextDocTitle %>"><%= obj.nextDocTitle %></a>
        </div>
    </div>
  <%}%>
</script>
